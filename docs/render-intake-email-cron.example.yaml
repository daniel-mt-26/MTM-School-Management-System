# OPT-IN EXAMPLE ONLY: no scheduler or billable Render service has been created.
# Verify the actual API service name and matching API/database region first.
# Source service must already define each referenced environment variable.
services:
  - type: cron
    name: mtm-beavers-intake-email
    runtime: python
    rootDir: backend
    plan: 0.5c-512mb
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py process_intake_email --limit 100 --require-enabled --fail-on-error
    autoDeployTrigger: off
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: DB_CONN_MAX_AGE
        value: "0"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECRET_KEY
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: DATABASE_URL
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: DJANGO_ALLOWED_HOSTS
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: CORS_ALLOWED_ORIGINS
      - key: CSRF_TRUSTED_ORIGINS
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: CSRF_TRUSTED_ORIGINS
      - key: MTM_MEDIA_STORAGE
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: MTM_MEDIA_STORAGE
      - key: SUPABASE_STORAGE_BUCKET
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: SUPABASE_STORAGE_BUCKET
      - key: SUPABASE_S3_ENDPOINT
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: SUPABASE_S3_ENDPOINT
      - key: SUPABASE_S3_REGION
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: SUPABASE_S3_REGION
      - key: SUPABASE_S3_ACCESS_KEY_ID
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: SUPABASE_S3_ACCESS_KEY_ID
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: SUPABASE_S3_SECRET_ACCESS_KEY
      - key: DJANGO_EMAIL_BACKEND
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: DJANGO_EMAIL_BACKEND
      - key: EMAIL_HOST
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: EMAIL_HOST
      - key: EMAIL_PORT
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: EMAIL_PORT
      - key: EMAIL_HOST_USER
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: EMAIL_HOST_USER
      - key: EMAIL_HOST_PASSWORD
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: EMAIL_HOST_PASSWORD
      - key: DEFAULT_FROM_EMAIL
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: DEFAULT_FROM_EMAIL
      - key: MTM_INTAKE_BEAVERS_SCHOOL_ID
        fromService:
          name: mtm-sms-api
          type: web
          envVarKey: MTM_INTAKE_BEAVERS_SCHOOL_ID
      # Set the provider-approved TLS/SSL pair after review. These defaults are STARTTLS.
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: EMAIL_TIMEOUT
        value: "15"
      - key: MTM_INTAKE_SCHOOL_EMAIL
        value: beaversecdcentre@gmail.com
      - key: MTM_INTAKE_CONTACT_EMAIL
        value: beaversecdcentre@gmail.com
      - key: MTM_INTAKE_CONTACT_PHONES
        value: "+263 775 177 935 / +263 772 405 912"
      - key: MTM_INTAKE_DASHBOARD_URL
        sync: false
      - key: MTM_INTAKE_EMAIL_ENABLED
        value: "false"
      - key: MTM_INTAKE_SMTP_VERIFIED
        value: "false"
      - key: MTM_INTAKE_EMAIL_MAX_ATTEMPTS
        value: "5"
      - key: MTM_INTAKE_EMAIL_LEASE_SECONDS
        value: "600"
